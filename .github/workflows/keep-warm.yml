# ══════════════════════════════════════════════════════════════════════════
#  Keep the app awake during working hours — and only during working hours.
#  ------------------------------------------------------------------------
#  Render spins a free service down after 15 minutes idle and takes 50+
#  seconds to wake. Neon suspends its compute after about five. Neither is a
#  fault, and neither is worth paying to avoid — but a client clicking a link
#  and waiting ninety seconds is.
#
#  THE PART PEOPLE GET WRONG: pinging around the clock does not work here.
#  Both free tiers meter time spent awake, and both budgets are smaller than
#  a month:
#
#    Render  750 instance-hours/month, shared across EVERY free service on
#            the account. Two services awake 24/7 need ~1,460. You would be
#            suspended somewhere in the third week.
#    Neon    100 CU-hours/month. At the 0.25 CU floor that is ~400 hours of
#            wall clock; awake 24/7 needs ~730.
#
#  Ten hours a day, five days a week, fits both with room to spare:
#    Render  2 services × 10h × ~22 days ≈ 440 of 750
#    Neon    10h × ~22 days ≈ 220 hours ≈ 55 of 100 CU-hours
#
#  Widen the window and check the arithmetic again before you do.
# ══════════════════════════════════════════════════════════════════════════

name: Keep warm

on:
  schedule:
    # Every 10 minutes, 03:00–12:59 UTC, Sunday to Thursday.
    #
    # GitHub cron is always UTC. That window is 09:00–19:00 in Dhaka
    # (UTC+6) — change the hours if you are somewhere else, and remember
    # that a country observing daylight saving shifts under this schedule
    # twice a year while the cron stays put.
    #
    # Ten minutes because Render's idle timer is fifteen. Fifteen would
    # race it.
    - cron: '*/10 3-12 * * 0-4'

  # So you can prove it works without waiting for the next slot, and warm
  # things up by hand before a demo.
  workflow_dispatch:

# Two pings that overlap achieve nothing and cost double.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    # A wake can take 50+ seconds per service and the default is 6 hours —
    # a hung request would otherwise bill six hours against the quota.
    timeout-minutes: 5

    steps:
      # /health/ready, not /health.
      #
      # /health answers from memory: it wakes Render and leaves Neon asleep,
      # so the first real page load still pays the database's wake. /ready
      # runs SELECT 1, which is what keeps both up.
      - name: Wake the API and the database
        run: |
          curl --silent --show-error --fail --max-time 90 --retry 2 \
            "$API_URL/health/ready" || echo "API did not answer — cold start may have exceeded 90s"
        env:
          API_URL: https://taskforge-api-5i62.onrender.com

      # The web service sleeps on its own timer. Waking only the API means
      # the browser still waits for this one on the first visit.
      - name: Wake the web app
        run: |
          curl --silent --show-error --fail --max-time 90 --retry 2 \
            --output /dev/null "$WEB_URL/login" || echo "Web did not answer"
        env:
          WEB_URL: https://taskforge-web.onrender.com

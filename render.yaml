# ══════════════════════════════════════════════════════════════════════════
#  TaskForge on Render
#  ------------------------------------------------------------------------
#  Two services from one repository: the API, and the web app that talks to
#  it. Render reads this file when you create a Blueprint, so the shape of the
#  deployment lives in version control rather than in a dashboard nobody can
#  diff.
#
#  The database is deliberately NOT here. Render's free Postgres expires 30
#  days after creation and is then deleted — that is not a production database,
#  it is a countdown. Use Neon's free tier instead and paste its connection
#  string into DATABASE_URL. See docs/07-deployment.md.
#
#  Free-plan reality: both services sleep after 15 minutes idle and take 30–60
#  seconds to wake. The web app calls the API, so a first visit after a quiet
#  night can be a minute and a half of nothing. Fine for internal use; not for
#  a link you send a client cold.
# ══════════════════════════════════════════════════════════════════════════

services:
  # ── The API ─────────────────────────────────────────────────────────────
  - type: web
    name: taskforge-api
    runtime: node
    plan: free
    # Match this to the region your Neon database is in. Every request makes
    # several round trips to the database, so a service in Oregon talking to a
    # database in Singapore pays that latency on every page — and it shows up
    # as "the app feels slow" rather than as anything you can point at.
    region: singapore
    rootDir: api
    healthCheckPath: /health

    # `prisma generate` before `tsc`, because the build imports the generated
    # client and it is not in the repository. `migrate deploy` last, so the
    # schema is in place before the new instance starts serving.
    #
    # Migrations run in the build rather than at boot on purpose: a boot-time
    # migration runs once per instance, and two instances starting together
    # would race each other.
    # `--include=dev` is not optional here, and the reason is easy to miss.
    #
    # `NODE_ENV=production` is set below because the app needs it at runtime.
    # npm also reads it, and skips devDependencies — where `typescript` and the
    # `prisma` CLI live. Without the flag the install succeeds, and then `tsc`
    # is not found, which reads like a broken repository rather than a build
    # that quietly declined to install its own tools.
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build && npx prisma migrate deploy
    startCommand: npm run start

    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production

      # Render sets PORT itself and the app reads it.

      # The web app's public address — the CORS allow-list, and the base of
      # every link in every email.
      #
      # Typed in rather than wired with `fromService`, which returns a bare
      # hostname (`taskforge-web.onrender.com`). This has to be a full URL:
      # the app validates it as one, and half of an invitation link is worse
      # than none. Set it after the first deploy — see docs/07-deployment.md,
      # which walks through the two passes the two services need.
      - key: WEB_ORIGIN
        sync: false

      # Neon. Paste the pooled connection string, and keep `?sslmode=require`.
      - key: DATABASE_URL
        sync: false

      # Generated by Render, different from each other, never seen by a human.
      # Reusing one secret for both token types would let an access token be
      # replayed as a refresh token — the app refuses to start if they match.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      # Close this the moment your own account exists. Everyone else joins by
      # invitation; leaving it open invites strangers to create organisations
      # on your server.
      - key: ALLOW_REGISTRATION
        value: 'false'

      # Email. `console` is refused in production — it prints invitations to
      # the log and sends nothing, which looks like working software until
      # somebody waits for a message that never arrives.
      #
      # `brevo`, not `smtp`, and this is not a preference.
      #
      # Render free web services cannot send outbound traffic on ports 25, 465
      # or 587. Not refused — dropped. nodemailer waits out its timeout, and
      # whatever request triggered the email waits with it, so creating a
      # project with an invitation took fifteen seconds and then reported
      # failure for a project that had already been written. Everything looked
      # broken except the thing that was.
      #
      # Brevo's REST API is the same mail service on port 443. If this service
      # is ever upgraded to a paid instance, `smtp` becomes available again —
      # but there is no reason to go back.
      - key: EMAIL_TRANSPORT
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      # Web push. Generate once and keep them: rotating the public key
      # invalidates every existing subscription and every user has to grant
      # permission again.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

      - key: LOG_LEVEL
        value: info
      - key: LOG_PRETTY
        value: 'false'

  # ── The web app ─────────────────────────────────────────────────────────
  # Server-rendered, so this is a Node service and not a static site. The
  # role decides which shell a person gets and that decision is made on the
  # server — rendering it in the browser would briefly show a shell they are
  # not entitled to.
  - type: web
    name: taskforge-web
    runtime: node
    plan: free
    # Same region as the API. This one calls it on every single request.
    region: singapore
    rootDir: web

    # Same reason as the API: `@react-router/dev`, `vite`, `tailwindcss` and
    # `typescript` are all devDependencies, and all of them are needed to
    # produce the bundle that `npm start` then serves.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start

    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production

      # Where the API lives, from the API's own service definition. The
      # `/api/v1` suffix is part of what the client expects, so it is appended
      # in the dashboard — `fromService` gives the host only.
      - key: API_URL
        sync: false

      # Signs the session cookie that holds the access and refresh tokens.
      # Change it and every signed-in person is signed out; leak it and
      # somebody can forge a session.
      - key: SESSION_SECRET
        generateValue: true
